name: Release

# Publishing is a deliberate act: cutting a GitHub Release publishes it. A bare
# tag push does not, so tags stay cheap. Triggering on both would double-publish,
# because creating a release through the UI also fires the tag push event.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # mints the OIDC token npm trusted publishing exchanges for
                    # short-lived credentials, and signs the provenance attestation

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build

      - name: Fail if the release tag does not match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with the
      # Node runner is older, so it is upgraded rather than assumed.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      # No token: npm exchanges the OIDC token for short-lived credentials, which
      # is why there is no NODE_AUTH_TOKEN here. Provenance is signed from the
      # same identity.
      - name: Publish
        run: npm publish --provenance --access public
